# Semgrep: rule-based security scan of the code. Free, no account or API key needed.
name: semgrep
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v6
      - run: semgrep scan --config auto --error
        env:
          SEMGREP_SEND_METRICS: "off"
