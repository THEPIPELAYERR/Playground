# CodeQL: GitHub's own security scanning, free on public repos.
# Results show up in the repo's Security tab → Code scanning.
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * 1" # Mondays
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
