# PR-Agent: AI review, description, and suggestions on every pull request, using Claude.
# Setup: add a repo secret named ANTHROPIC_KEY (Settings → Secrets and variables → Actions).
# Until that secret exists, this job skips itself instead of failing.
# Costs a few cents of API usage per PR. Comment "/review" or "/improve" on a PR to re-run.
# Runs only for trusted authors (see the job's if:), so strangers can't steer it or spend the key.
name: pr-agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    # Only run for people who can already change this repo (prompt-injection guard):
    #  - pull requests opened from branches of this repo (not forks), not by bots
    #  - /review or /improve comments on a PR from the owner or a collaborator
    # A stranger's PR or comment on this public repo never reaches the model or the API key.
    if: >-
      ${{ github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check for the API key
        id: key
        env:
          K: ${{ secrets.ANTHROPIC_KEY }}
        run: |
          if [ -n "$K" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ANTHROPIC_KEY secret not set, skipping PR-Agent"; fi
      - name: PR Agent action step
        if: steps.key.outputs.present == 'true'
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "anthropic/claude-opus-5"
          config.fallback_models: '["anthropic/claude-haiku-4-5-20251001"]'
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
