<!doctype html>
<html><head><meta charset="utf-8">
<!-- "They Smile - Part 3": 2D animated short. Backgrounds are drawn once; characters, props, camera,
     lighting and subtitles are animated every frame. Deterministic: render.js calls render(t) per frame. -->
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script src="character.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const main = document.getElementById('c').getContext('2d');

// ---------------------------------------------------------------- cast
const CAST = {
  dale: { skin: [232, 184, 156], age: 0.55, hair: { style: 'balding', color: [70, 52, 40] }, expr: 'grin', rash: 1, outfit: 'vest', outfitColor: [170, 32, 30], stubble: 1, seed: 3, blood: 1 },
  rake: { skin: [240, 198, 172], female: 1, age: 0.5, hair: { style: 'curlers', color: [150, 70, 40] }, expr: 'grin', rash: 1, outfit: 'robe', outfitColor: [232, 140, 176], seed: 5, iris: '#3d6b4a' },
  maddie: { skin: [244, 210, 188], female: 1, age: 0.15, hair: { style: 'long', color: [196, 160, 96] }, expr: 'scared', outfit: 'hoodie', outfitColor: [110, 122, 140], tears: 1, ropes: 1, seed: 7, iris: '#4a6d9a' },
  gran: { skin: [236, 200, 182], female: 1, age: 0.9, hair: { style: 'bun', color: [205, 202, 196] }, expr: 'calm', rash: 0.8, outfit: 'cardigan', outfitColor: [196, 150, 48], glasses: 1, seed: 9, iris: '#5a4a3a' },
  trucker: { skin: [200, 150, 118], age: 0.4, hair: { style: 'cap', color: [60, 45, 35], capColor: [180, 40, 40] }, expr: 'laugh', rash: 1, beard: 1, outfit: 'flannel', outfitColor: [170, 40, 40], seed: 11 },
  teen: { skin: [178, 128, 96], age: 0.1, hair: { style: 'short', color: [30, 24, 20] }, expr: 'grin', rash: 1, outfit: 'hoodie', outfitColor: [60, 140, 90], seed: 13, iris: '#2a1a10' },
  bald: { skin: [214, 170, 140], age: 0.6, hair: { style: 'balding', color: [120, 110, 100] }, expr: 'laugh', rash: 1, outfit: 'tee', outfitColor: [60, 70, 90], stubble: 1, seed: 15, blood: 1 },
  pony: { skin: [150, 100, 76], female: 1, age: 0.3, hair: { style: 'long', color: [40, 28, 22] }, expr: 'grin', rash: 1, outfit: 'tee', outfitColor: [220, 200, 60], seed: 17, iris: '#2a1a10' },
};
const v = (k, o) => Object.assign({}, CAST[k], o || {});

// ---------------------------------------------------------------- dialogue (same timings as vo-cues.csv)
// [start, speaker, line]  speaker: N narrator, D Dale, R rake lady, C crowd, M Maddie, G Grandma
const LINES = [
  [0.2, 'N', 'There were eleven of them.'],
  [4.4, 'R', 'Hi sweetie! You lost?'],
  [6.2, 'N', 'They were friendly. That was the worst part.'],
  [8.8, 'D', 'Ha ha ha!'],
  [9.6, 'D', "Door's open, buddy! Come on in!"],
  [11.2, 'N', 'Eleven behind me. One in front.'],
  [13.3, 'N', 'I had a tire iron.'],
  [14.8, 'N', 'And one way to go.'],
  [17.8, 'N', 'So I went in.'],
  [18.6, 'D', 'Ha— ha ha ha!'],
  [21.4, 'N', 'I locked the door.'],
  [23.0, 'N', "They didn't even try it. They just watched."],
  [24.8, 'C', 'Take your time!'],
  [26.9, 'N', 'The trail went to the back room.'],
  [28.6, 'M', '...hello?'],
  [29.8, 'N', 'Maddie.'],
  [31.4, 'M', 'You came. You actually came.'],
  [33.3, 'N', 'No rash. She was clean.'],
  [35.0, 'M', 'You have to go. Now.'],
  [37.7, 'M', "Dale's not the one in charge."],
  [39.9, 'M', 'She is.'],
  [43.6, 'G', 'Sit down, honey.'],
  [45.6, 'G', "We've been waiting for you."],
];
const lineEnd = i => Math.min((LINES[i + 1] || [99])[0] - 0.05, LINES[i][0] + 0.45 + LINES[i][2].split(' ').length * 0.36);
// mouth openness for a speaker at time t (a lip-flap; real VO will be timed to the same starts)
function talking(t, who) {
  for (let i = 0; i < LINES.length; i++) { const [a, w] = LINES[i]; if (w === who && t >= a && t < lineEnd(i) - 0.15) return clamp(Math.abs(Math.sin(t * 19) * Math.sin(t * 7.1 + 1)) * 1.3, 0, 1); }
  return 0;
}
function blinkAt(t, seed) { const per = 2.6 + (seed % 5) * 0.45, ph = (t + seed * 0.77) % per; return ph < 0.14 ? Math.sin(ph / 0.14 * Math.PI) : 0; }

// ---------------------------------------------------------------- backgrounds (drawn once)
function sky(top, bot, y1 = H) { const g = x.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); x.fillStyle = g; x.fillRect(0, 0, W, y1); }
function stars(n, y1, seed) { const r = rng(seed); x.fillStyle = 'rgba(255,255,240,0.8)'; for (let i = 0; i < n; i++) { x.beginPath(); x.arc(r() * W, r() * y1, 1 + r() * 2.2, 0, Math.PI * 2); x.fill(); } }
function bokeh(n, seed, cols, w = W, h = H) { const r = rng(seed); for (let i = 0; i < n; i++) { const cx = r() * w, cy = r() * h * 0.9, rr = 40 + r() * 140; const g = x.createRadialGradient(cx, cy, 0, cx, cy, rr); const c = cols[i % cols.length]; g.addColorStop(0, `rgba(${c},0.5)`); g.addColorStop(0.7, `rgba(${c},0.22)`); g.addColorStop(1, `rgba(${c},0)`); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI * 2); x.fill(); } }
function bloodSmiley(cx, cy, s, a = 0.85) {
  x.save(); x.strokeStyle = `rgba(150,8,14,${a})`; x.fillStyle = `rgba(150,8,14,${a})`; x.lineCap = 'round';
  x.lineWidth = s * 0.14; x.beginPath(); x.arc(cx, cy, s, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(cx - s * 0.35, cy - s * 0.25, s * 0.1, 0, Math.PI * 2); x.arc(cx + s * 0.35, cy - s * 0.25, s * 0.1, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(cx, cy + s * 0.05, s * 0.55, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke();
  x.lineWidth = s * 0.06; for (let k = 0; k < 3; k++) { const dx = cx + (k - 1) * s * 0.45; x.beginPath(); x.moveTo(dx, cy + s * 0.9); x.lineTo(dx, cy + s * (1.3 + 0.2 * k)); x.stroke(); }
  x.restore();
}
function shelves(y0, y1, seed, light) {
  const r = rng(seed);
  for (let y = y0; y < y1; y += 150) {
    fillInk(path(q => q.rect(-10, y + 120, W + 20, 22)), rgb([160, 170, 175], light), 3);
    for (let xx = 0; xx < W; ) { const w = 50 + r() * 70, h = 60 + r() * 55; const c = [[200, 60, 50], [60, 120, 190], [230, 190, 60], [90, 160, 90], [220, 120, 40], [150, 80, 160]][r() * 6 | 0]; fillInk(path(q => q.rect(xx, y + 120 - h, w - 6, h)), rgb(c, light), 2); xx += w; }
  }
}
// soft radial light. col uses 'A' as the alpha placeholder, e.g. 'rgba(255,200,120,A)'
function soft(cx, cy, r0, r1, col) { const g = x.createRadialGradient(cx, cy, r0, cx, cy, r1); g.addColorStop(0, col.replace('A', '1')); g.addColorStop(1, col.replace('A', '0')); x.fillStyle = g; x.fillRect(cx - r1, cy - r1, r1 * 2, r1 * 2); }

const BG = {
  road() {
    sky('#0b0d2c', '#3a2557', 1000); stars(140, 900, 2);
    fillInk(path(q => { q.moveTo(0, 1000); for (let i = 0; i <= 30; i++) q.lineTo(i * 36, 960 - ((i * 37) % 7) * 12); q.lineTo(W, 1000); q.closePath(); }), '#0a0a18', 0);
    const rd = x.createLinearGradient(0, 1000, 0, H); rd.addColorStop(0, '#1c1a28'); rd.addColorStop(1, '#2e2b3c'); x.fillStyle = rd; x.fillRect(0, 1000, W, 920);
    x.fillStyle = '#d8b84a'; for (let k = 0; k < 8; k++) { const y0 = 1010 + k * k * 14, y1 = y0 + 8 + k * 5, w0 = 4 + k * 3; x.beginPath(); x.moveTo(540 - w0 / 2, y0); x.lineTo(540 + w0 / 2, y0); x.lineTo(540 + w0, y1); x.lineTo(540 - w0, y1); x.closePath(); x.fill(); }
    fillInk(path(q => q.rect(-40, 600, 420, 80)), '#e9e4d6', 4); fillInk(path(q => q.rect(-40, 680, 420, 20)), '#fff7c2', 0);
    fillInk(path(q => q.rect(60, 700, 30, 330)), '#5a5a66', 3); fillInk(path(q => q.rect(300, 700, 30, 330)), '#5a5a66', 3);
    soft(180, 1030, 10, 380, 'rgba(255,190,90,A)');
  },
  night() { sky('#141638', '#36244a'); bokeh(22, 4, ['255,240,200', '255,200,120', '255,120,100'], W * 1.3, H); },
  store() {
    x.fillStyle = '#d6ebe2'; x.fillRect(0, 0, W, H);
    fillInk(path(q => q.rect(0, 0, W, 120)), '#f6fbf7', 0); for (let k = 0; k < 3; k++) fillInk(path(q => q.rect(150 + k * 300, 40, 220, 40)), '#ffffff', 3);
    shelves(250, 1300, 8, 0.95);
    const fl = x.createLinearGradient(0, 1380, 0, H); fl.addColorStop(0, '#b8c9c2'); fl.addColorStop(1, '#93a59e'); x.fillStyle = fl; x.fillRect(0, 1380, W, 540);
  },
  lot() {
    sky('#0d0f28', '#2a2040', 900);
    const g = x.createLinearGradient(0, 900, 0, H); g.addColorStop(0, '#191823'); g.addColorStop(1, '#2a2836'); x.fillStyle = g; x.fillRect(0, 900, W, 1020);
    for (let k = 0; k < 6; k++) fillInk(path(q => { q.moveTo(80 + k * 190, 980); q.lineTo(90 + k * 190, 980); q.lineTo(-300 + k * 330, H); q.lineTo(-280 + k * 330, H); q.closePath(); }), 'rgba(230,230,230,0.25)', 0);
  },
  outside() {
    sky('#0a0b22', '#241a3a');
    for (const [hx, hy] of [[260, 260], [820, 300]]) soft(hx, hy, 10, 560, 'rgba(255,248,220,A)');
  },
  glassFx() {
    x.fillStyle = 'rgba(255,255,255,0.07)'; const r = rng(31);
    for (let k = 0; k < 40; k++) { x.beginPath(); x.ellipse(r() * W, r() * H, 30 + r() * 90, 10 + r() * 30, r() * 3, 0, Math.PI * 2); x.fill(); }
    x.strokeStyle = 'rgba(150,8,14,0.75)'; x.lineWidth = 34; x.lineCap = 'round'; x.beginPath(); x.moveTo(120, 420); x.quadraticCurveTo(300, 470, 420, 400); x.stroke();
    for (let k = 0; k < 4; k++) { x.lineWidth = 9; x.beginPath(); x.moveTo(150 + k * 80, 430 + (k % 2) * 20); x.lineTo(150 + k * 80, 520 + k * 25); x.stroke(); }
    const lg = x.createLinearGradient(500, 0, 300, H); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.1)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = lg; x.beginPath(); x.moveTo(600, 0); x.lineTo(720, 0); x.lineTo(220, H); x.lineTo(100, H); x.closePath(); x.fill();
  },
  hall() {
    x.fillStyle = '#9fb0a6'; x.fillRect(0, 0, W, H);
    const g = x.createLinearGradient(0, 1450, 0, H); g.addColorStop(0, '#6f7a73'); g.addColorStop(1, '#58625c'); x.fillStyle = g; x.fillRect(0, 1450, W, 470);
    fillInk(path(q => q.rect(290, 370, 540, 1090)), '#3a2a1e', 5);
    fillInk(path(q => q.rect(300, 380, 520, 1070)), '#ffd98a', 0);
    x.fillStyle = 'rgba(140,8,14,0.9)'; x.beginPath(); x.moveTo(700, 1440); x.quadraticCurveTo(560, 1600, 420, 1920); x.lineTo(620, 1920); x.quadraticCurveTo(680, 1640, 760, 1445); x.closePath(); x.fill();
    fillInk(path(q => { q.moveTo(60, 1480); q.lineTo(250, 1480); q.lineTo(230, 1700); q.lineTo(80, 1700); q.closePath(); }), '#e3c234', 4);
    fillInk(path(q => q.rect(150, 1000, 22, 490)), '#a8743c', 3);
  },
  backroom() {
    x.fillStyle = '#4a3226'; x.fillRect(0, 0, W, H);
    for (let y = 300; y < 1700; y += 260) { fillInk(path(q => q.rect(0, y, W, 18)), '#6b4a34', 3); for (let k = 0; k < 6; k++) fillInk(path(q => q.rect(30 + k * 180, y - 150, 150, 150)), '#a07a52', 3); }
  },
  dark() { x.fillStyle = '#2a1c16'; x.fillRect(0, 0, W, H); },
  corner() { x.fillStyle = '#141826'; x.fillRect(0, 0, W, H); fillInk(path(q => { q.moveTo(60, 120); q.lineTo(260, 120); q.lineTo(300, 300); q.lineTo(20, 300); q.closePath(); }), '#c98a3a', 4); },
};
const bg = {};
for (const k in BG) { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; x = cv.getContext('2d'); BG[k](); bg[k] = cv; }

// ---------------------------------------------------------------- props
function truckCab() {
  fillInk(path(q => q.rect(300, 1000, 520, 70)), '#7e2420', 4);
  fillInk(path(q => { q.moveTo(310, 1070); q.lineTo(810, 1070); q.lineTo(870, 1270); q.lineTo(250, 1270); q.closePath(); }), '#16203a', 4);
}
function truckBody() {
  x.fillStyle = 'rgba(150,180,255,0.2)'; x.beginPath(); x.moveTo(310, 1070); x.lineTo(810, 1070); x.lineTo(870, 1270); x.lineTo(250, 1270); x.closePath(); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.25)'; x.beginPath(); x.moveTo(360, 1070); x.lineTo(430, 1070); x.lineTo(330, 1270); x.lineTo(260, 1270); x.closePath(); x.fill();
  ink(path(q => { q.moveTo(310, 1070); q.lineTo(810, 1070); q.lineTo(870, 1270); q.lineTo(250, 1270); q.closePath(); }), 4);
  fillInk(path(q => { q.moveTo(200, 1270); q.lineTo(920, 1270); q.lineTo(960, 1420); q.lineTo(160, 1420); q.closePath(); }), '#9b2c26', 4);
  fillInk(path(q => { q.moveTo(620, 1270); q.lineTo(920, 1270); q.lineTo(960, 1420); q.lineTo(680, 1420); q.closePath(); }), '#7e2420', 0);
  fillInk(path(q => q.rect(150, 1420, 820, 220)), '#7e2420', 4);
  fillInk(path(q => q.rect(380, 1440, 360, 170)), '#1a1a1e', 3);
  for (let k = 0; k < 5; k++) ink(path(q => { q.moveTo(380, 1470 + k * 32); q.lineTo(740, 1470 + k * 32); }), 3);
  fillInk(path(q => q.roundRect(110, 1640, 900, 80, 20)), '#c9ccd2', 4);
  for (const hx of [255, 865]) fillInk(path(q => q.arc(hx, 1525, 80, 0, Math.PI * 2)), '#fffbe6', 4);
  fillInk(path(q => q.rect(170, 1720, 140, 200)), '#111', 3); fillInk(path(q => q.rect(810, 1720, 140, 200)), '#111', 3);
}
function tireIron(len) { fillInk(path(q => q.rect(-40, -26, len, 52)), '#8d929c', 4); fillInk(path(q => q.rect(-40, 4, len, 20)), '#646a74', 0); fillInk(path(q => q.roundRect(len - 60, -50, 110, 100, 18)), '#7a7f88', 4); fillInk(path(q => q.arc(len - 5, 0, 26, 0, Math.PI * 2)), '#2a2c30', 3); }
function doorFrame(dx) { x.save(); x.translate(dx, 0); fillInk(path(q => q.rect(0, 0, 60, H)), '#33363d', 4); fillInk(path(q => q.rect(W - 60, 0, 60, H)), '#33363d', 4); fillInk(path(q => q.rect(0, 0, W, 60)), '#33363d', 4); fillInk(path(q => q.rect(0, 1640, W, 70)), '#43464e', 4); x.restore(); }

// ---------------------------------------------------------------- scenes: S[name](t, local time)
const S = {};
S.truck = (t, l) => {
  x.drawImage(bg.road, 0, 0);
  // the church van rolls in behind, a beat later
  const kv = lerp(0.45, 1, ease((l - 0.3) / 3.2)), bob = Math.sin(t * 13) * 4;
  x.save(); x.translate(1000, 1500); x.scale(kv, kv); x.translate(-1000, -1500 + bob);
  fillInk(path(q => q.roundRect(760, 820, 420, 560, 40)), '#efefe8', 4); fillInk(path(q => q.rect(760, 1080, 420, 40)), '#2d5fa8', 3);
  x.fillStyle = '#2d5fa8'; x.font = '900 34px Inter, sans-serif'; x.textAlign = 'left'; x.fillText('OPEN DOOR', 800, 1170); x.font = '700 24px Inter, sans-serif'; x.fillText('COMMUNITY CHURCH', 800, 1200);
  fillInk(path(q => q.rect(790, 860, 260, 180)), '#1a2440', 3);
  person(900, 960 + Math.sin(t * 9) * 4, 62, v('pony', { look: [-1, 0], blink: blinkAt(t, 1), talk: 0.4 + 0.4 * Math.sin(t * 15) }));
  x.fillStyle = 'rgba(160,190,255,0.18)'; x.fillRect(790, 860, 260, 180);
  x.restore();
  // the pickup drives straight at us, bouncing, people in the bed laughing
  const k = lerp(0.38, 1.0, ease(l / 3.4)), bb = Math.sin(t * 14) * 5 * k;
  x.save(); x.translate(560, 1720); x.scale(k, k); x.translate(-560, -1720 + bb);
  const rider = (cx, cy, r, key, i) => person(cx, cy + Math.sin(t * 8 + i) * 8, r, v(key, { headRot: Math.sin(t * 3 + i) * 0.12, talk: Math.abs(Math.sin(t * 16 + i * 2)), blink: blinkAt(t, i + 2), bodyDx: Math.sin(t * 40 + i) * 0.02, expr: 'laugh' }));
  rider(300, 900, 66, 'teen', 1); rider(450, 860, 72, 'bald', 2); rider(640, 870, 70, 'trucker', 3); rider(780, 905, 62, 'rake', 4);
  truckCab();
  person(560, 1185, 88, v('trucker', { expr: 'laugh', talk: Math.abs(Math.sin(t * 14)), headRot: Math.sin(t * 2) * 0.08 }));
  truckBody();
  x.restore();
  // headlight glare
  x.save(); x.globalCompositeOperation = 'lighter';
  for (const hx of [255, 865]) { const px = 560 + (hx - 560) * k, py = 1720 + (1525 - 1720) * k + bb; soft(px, py, 20, (380 + 40 * Math.sin(t * 7)) * (0.5 + 0.5 * k), 'rgba(255,248,215,A)'); }
  x.restore();
};
S.rake = (t, l) => {
  x.drawImage(bg.night, -l * 30, 0, W * 1.3, H);
  const lean = 1 + 0.05 * ease(l / 4);
  x.save(); x.translate(540, 1100); x.scale(lean, lean); x.translate(-540, -1100);
  x.save(); x.translate(240, 1900); x.rotate(-0.32 + Math.sin(t * 2) * 0.02);
  fillInk(path(q => q.rect(-16, -1700, 32, 1700)), '#a8743c', 3); fillInk(path(q => q.rect(-150, -1730, 300, 34)), '#7d7f86', 3);
  for (let k = 0; k < 9; k++) fillInk(path(q => q.rect(-140 + k * 35, -1800, 12, 72)), '#7d7f86', 2);
  x.restore();
  const giggle = t > 6.0 && t < 6.8;
  person(560, 860, 330, v('rake', { look: [0.3 * Math.sin(t * 0.7), 0], talk: Math.max(talking(t, 'R'), giggle ? Math.abs(Math.sin(t * 30)) : 0), blink: blinkAt(t, 3), headRot: 0.07 * Math.sin(t * 1.4) + (giggle ? Math.sin(t * 40) * 0.03 : 0), bodyDx: giggle ? Math.sin(t * 40) * 0.02 : 0, breath: Math.sin(t * 2.2), expr: giggle ? 'laugh' : 'grin' }));
  const wave = Math.sin(t * 9) * 0.35;
  fillInk(path(q => { q.moveTo(800, 1260); q.lineTo(960, 1260); q.lineTo(1000, 1920); q.lineTo(760, 1920); q.closePath(); }), rgb(CAST.rake.outfitColor), 4);
  hand(880, 1120, 170, -0.25 + wave, 'wave', CAST.rake.skin);
  x.restore();
};
S.dale = (t, l) => {
  x.drawImage(bg.store, 0, 0);
  fillInk(path(q => { q.moveTo(0, 0); q.lineTo(230, 120); q.lineTo(230, 1800); q.lineTo(0, 1920); q.closePath(); }), 'rgba(150,190,200,0.35)', 0);
  fillInk(path(q => q.rect(200, 100, 46, 1720)), '#3a3d44', 4);
  bloodSmiley(110, 620, 80);
  const lol = t < 9.55;
  person(620, 780, 290, v('dale', { expr: lol ? 'laugh' : 'grin', talk: lol ? Math.abs(Math.sin(t * 26)) : talking(t, 'D'), headRot: lol ? -0.12 + Math.sin(t * 40) * 0.03 : 0.05 * Math.sin(t * 2), bodyDx: lol ? Math.sin(t * 38) * 0.025 : 0, look: [-0.4, 0], blink: blinkAt(t, 5), breath: Math.sin(t * 2) }));
  fillInk(path(q => { q.moveTo(330, 1180); q.quadraticCurveTo(260, 1080, 250, 940); q.lineTo(330, 930); q.quadraticCurveTo(360, 1050, 440, 1130); q.closePath(); }), '#80868e', 4);
  hand(245, 905, 85, -0.2, 'fist', CAST.dale.skin);
};
S.iron = (t, l) => {
  x.drawImage(bg.lot, 0, 0);
  // walking toward the store: it grows, the view bobs with each step
  const k = lerp(1, 1.7, ease(l / 3.6)), step = Math.sin(l * 7.5);
  x.save(); x.translate(790, 800 + step * 6); x.scale(k, k); x.translate(-790, -800);
  fillInk(path(q => q.rect(560, 640, 460, 280)), '#e8f4ec', 4);
  fillInk(path(q => q.rect(560, 600, 460, 50)), '#c2262a', 3); x.fillStyle = '#fff'; x.font = '900 34px Inter, sans-serif'; x.textAlign = 'center'; x.fillText('GAS · FOOD', 790, 637);
  fillInk(path(q => q.rect(740, 700, 110, 220)), '#bfe0d2', 3);
  person(795, 770, 26, v('dale', { talk: 0.6 }));
  x.save(); x.globalAlpha = 0.4; soft(790, 800, 40, 520, 'rgba(220,255,235,A)'); x.restore();
  x.restore();
  // his arm and the tire iron, swinging slightly with the walk
  const squeeze = 1 + 0.05 * Math.max(0, Math.sin(clamp((t - 13.3) / 0.4, 0, 1) * Math.PI));

S.gran = (t, l) => {

// [start, scene]. Shot starts match the earlier cut so the sound design and VO cues line up.
const SHOTS = [[0.0, 'truck'], [4.0, 'rake'], [8.6, 'dale'], [13.0, 'iron'], [16.6, 'impact'], [20.6, 'glass'], [26.6, 'hall'], [31.0, 'maddie'], [37.4, 'whisper'], [42.4, 'gran'], [49.0, 'end']];
const GRADE = { truck: ['#6a70c8', 0.35], rake: ['#7a78c0', 0.25], dale: ['#d8f0e6', 0.08], iron: ['#6a70c8', 0.35], impact: ['#e6f2ea', 0.05], glass: ['#7076c4', 0.3], hall: ['#c9d6cc', 0.15], maddie: ['#ffcf9a', 0.18], whisper: ['#ffcf9a', 0.2], gran: ['#ffc58a', 0.18], end: ['#000', 0] };
const TL = { end: 53.0, shots: SHOTS, impact: 16.6, lock: 20.6, reveal: 42.4, endCard: 49.0, lines: LINES, whip: 41.9, slaps: [21.3, 21.35, 21.6, 21.65, 21.85, 22.1] };
window.TIMELINE = TL;

function subtitle(txt, who, alpha) {
  x.save(); x.globalAlpha = alpha; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '800 60px Inter, "DejaVu Sans", sans-serif';
  const lines = wrapText(txt, 880);
  const col = { N: '#ffffff', M: '#ffe27a' }[who] || '#ff8a7a';   // narrator white, Maddie yellow, the infected red
  lines.forEach((ln, i) => { const y = 1390 + (i - (lines.length - 1) / 2) * 76; x.lineWidth = 14; x.lineJoin = 'round'; x.strokeStyle = 'rgba(0,0,0,0.92)'; x.strokeText(ln, 540, y); x.fillStyle = col; x.fillText(ln, 540, y); });
  x.restore();
}

window.render = function (t) {
  x = main;
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  let i = 0; while (i + 1 < SHOTS.length && t >= SHOTS[i + 1][0]) i++;
  const [t0, key] = SHOTS[i], since = t - t0;
  S[key](t, since);
  // colour grade + soft vignette
  const [gc, gs] = GRADE[key];
  if (gs > 0) { x.save(); x.globalCompositeOperation = 'multiply'; x.globalAlpha = gs; x.fillStyle = gc; x.fillRect(0, 0, W, H); x.restore(); }
  const vg = x.createRadialGradient(540, 900, 500, 540, 960, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);
  // quick dip from black on hard cuts (the whip pan into Grandma has its own move)
