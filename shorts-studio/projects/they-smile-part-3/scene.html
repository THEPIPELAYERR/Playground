<!doctype html>
<html><head><meta charset="utf-8">
<!-- "They Smile - Part 3": motion comic. Panels are drawn once into offscreen canvases, then each frame
     composes them with camera moves, panel slides, captions, balloons and sound-effect lettering.
     Deterministic: render.js calls render(t) per frame. -->
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script src="comic.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const main = document.getElementById('c').getContext('2d');

// ---------------------------------------------------------------- cast
const CAST = {
  dale: { skin: [232, 184, 156], age: 0.55, hair: { style: 'balding', color: [70, 52, 40] }, expr: 'grin', rash: 1, outfit: 'vest', outfitColor: [170, 32, 30], stubble: 1, seed: 3, blood: 1 },
  rake: { skin: [240, 198, 172], female: 1, age: 0.5, hair: { style: 'curlers', color: [150, 70, 40] }, expr: 'grin', rash: 1, outfit: 'robe', outfitColor: [232, 140, 176], seed: 5, iris: '#3d6b4a' },
  maddie: { skin: [244, 210, 188], female: 1, age: 0.15, hair: { style: 'long', color: [196, 160, 96] }, expr: 'scared', outfit: 'hoodie', outfitColor: [110, 122, 140], tears: 1, ropes: 1, seed: 7, iris: '#4a6d9a' },
  gran: { skin: [236, 200, 182], female: 1, age: 0.9, hair: { style: 'bun', color: [205, 202, 196] }, expr: 'calm', rash: 0.8, outfit: 'cardigan', outfitColor: [196, 150, 48], glasses: 1, seed: 9, iris: '#5a4a3a' },
  trucker: { skin: [200, 150, 118], age: 0.4, hair: { style: 'cap', color: [60, 45, 35], capColor: [180, 40, 40] }, expr: 'laugh', rash: 1, beard: 1, outfit: 'flannel', outfitColor: [170, 40, 40], seed: 11, tongue: 1 },
  teen: { skin: [178, 128, 96], age: 0.1, hair: { style: 'short', color: [30, 24, 20] }, expr: 'grin', rash: 1, outfit: 'hoodie', outfitColor: [60, 140, 90], seed: 13, iris: '#2a1a10' },
  bald: { skin: [214, 170, 140], age: 0.6, hair: { style: 'balding', color: [120, 110, 100] }, expr: 'laugh', rash: 1, outfit: 'tee', outfitColor: [60, 70, 90], stubble: 1, seed: 15, blood: 1 },
  pony: { skin: [150, 100, 76], female: 1, age: 0.3, hair: { style: 'long', color: [40, 28, 22] }, expr: 'grin', rash: 1, outfit: 'tee', outfitColor: [220, 200, 60], seed: 17, iris: '#2a1a10' },
};
const v = (k, o) => Object.assign({}, CAST[k], o || {});

// ---------------------------------------------------------------- backgrounds
function sky(top, bot, y1 = H) { const g = x.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); x.fillStyle = g; x.fillRect(0, 0, W, y1); }
function stars(n, y1, seed) { const r = rng(seed); x.fillStyle = 'rgba(255,255,240,0.8)'; for (let i = 0; i < n; i++) { x.beginPath(); x.arc(r() * W, r() * y1, 1 + r() * 2.2, 0, Math.PI * 2); x.fill(); } }
function bokeh(n, seed, cols) { const r = rng(seed); for (let i = 0; i < n; i++) { const cx = r() * W, cy = r() * H * 0.9, rr = 40 + r() * 140; const g = x.createRadialGradient(cx, cy, 0, cx, cy, rr); const c = cols[i % cols.length]; g.addColorStop(0, `rgba(${c},0.55)`); g.addColorStop(0.7, `rgba(${c},0.25)`); g.addColorStop(1, `rgba(${c},0)`); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI * 2); x.fill(); } }
function speedLines(cx, cy, col, seed) { const r = rng(seed); x.strokeStyle = col; for (let i = 0; i < 90; i++) { const a = r() * Math.PI * 2, r0 = 260 + r() * 200; x.lineWidth = 3 + r() * 10; x.beginPath(); x.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); x.lineTo(cx + Math.cos(a) * 2400, cy + Math.sin(a) * 2400); x.stroke(); } }
function starburst(cx, cy, r0, r1, n, fill, seed) { const r = rng(seed); const p = path(q => { for (let i = 0; i <= n * 2; i++) { const a = i / (n * 2) * Math.PI * 2, rr = i % 2 ? r0 : r1 * (0.75 + 0.25 * r()); const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr; i ? q.lineTo(px, py) : q.moveTo(px, py); } q.closePath(); }); fillInk(p, fill, 7); }
function bloodSmiley(cx, cy, s, a = 0.85) {
  x.save(); x.strokeStyle = `rgba(150,8,14,${a})`; x.fillStyle = `rgba(150,8,14,${a})`; x.lineCap = 'round';
  x.lineWidth = s * 0.14; x.beginPath(); x.arc(cx, cy, s, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.arc(cx - s * 0.35, cy - s * 0.25, s * 0.1, 0, Math.PI * 2); x.arc(cx + s * 0.35, cy - s * 0.25, s * 0.1, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(cx, cy + s * 0.05, s * 0.55, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke();
  x.lineWidth = s * 0.06; for (let k = 0; k < 3; k++) { const dx = cx + (k - 1) * s * 0.45; x.beginPath(); x.moveTo(dx, cy + s * 0.9); x.lineTo(dx, cy + s * (1.3 + 0.2 * k)); x.stroke(); }
  x.restore();
}
function shelves(y0, y1, seed, light) {
  const r = rng(seed);
  for (let y = y0; y < y1; y += 150) {
    fillInk(path(q => q.rect(-10, y + 120, W + 20, 22)), rgb([160, 170, 175], light), 4);
    for (let xx = 0; xx < W; ) { const w = 50 + r() * 70, h = 60 + r() * 55; const c = [[200, 60, 50], [60, 120, 190], [230, 190, 60], [90, 160, 90], [220, 120, 40], [150, 80, 160]][r() * 6 | 0]; fillInk(path(q => q.rect(xx, y + 120 - h, w - 6, h)), rgb(c, light), 3); xx += w; }
  }
}

// ---------------------------------------------------------------- panels (drawn once)
const PANELS = {
  truck() {

    fillInk(path(q => q.roundRect(760, 820, 420, 560, 40)), '#efefe8', 6);
    fillInk(path(q => q.rect(760, 1080, 420, 40)), '#2d5fa8', 4);
    x.fillStyle = '#2d5fa8'; x.font = '900 34px Inter, sans-serif'; x.textAlign = 'left'; x.fillText('OPEN DOOR', 800, 1170); x.font = '700 24px Inter, sans-serif'; x.fillText('COMMUNITY CHURCH', 800, 1200);
    fillInk(path(q => q.rect(790, 860, 260, 180)), '#1a2440', 5);

    x.fillStyle = 'rgba(150,180,255,0.2)'; x.beginPath(); x.moveTo(310, 1070); x.lineTo(810, 1070); x.lineTo(870, 1270); x.lineTo(250, 1270); x.closePath(); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.28)'; x.beginPath(); x.moveTo(360, 1070); x.lineTo(430, 1070); x.lineTo(330, 1270); x.lineTo(260, 1270); x.closePath(); x.fill();
    ink(path(q => { q.moveTo(310, 1070); q.lineTo(810, 1070); q.lineTo(870, 1270); q.lineTo(250, 1270); q.closePath(); }), 6);
    const hood = path(q => { q.moveTo(200, 1270); q.lineTo(920, 1270); q.lineTo(960, 1420); q.lineTo(160, 1420); q.closePath(); }); fillInk(hood, '#9b2c26', 6);
    halftone(path(q => { q.moveTo(620, 1270); q.lineTo(920, 1270); q.lineTo(960, 1420); q.lineTo(680, 1420); q.closePath(); }), 'rgba(40,0,0,0.45)', 14, 4, [600, 1270, 960, 1420]);
    fillInk(path(q => q.rect(150, 1420, 820, 220)), '#7e2420', 6);
    fillInk(path(q => q.rect(380, 1440, 360, 170)), '#1a1a1e', 5);
    for (let k = 0; k < 5; k++) ink(path(q => { q.moveTo(380, 1470 + k * 32); q.lineTo(740, 1470 + k * 32); }), 5);
    fillInk(path(q => q.roundRect(110, 1640, 900, 80, 20)), '#c9ccd2', 6);
    for (const hx of [255, 865]) fillInk(path(q => q.arc(hx, 1525, 80, 0, Math.PI * 2)), '#fffbe6', 6);
    fillInk(path(q => q.rect(170, 1720, 140, 200)), '#111', 4); fillInk(path(q => q.rect(810, 1720, 140, 200)), '#111', 4);
  },
  rake() {

    fillInk(path(q => q.rect(-150, -1730, 300, 34)), '#7d7f86', 5);
    for (let k = 0; k < 9; k++) fillInk(path(q => q.rect(-140 + k * 35, -1800, 12, 72)), '#7d7f86', 3);
    x.restore();
    person(560, 860, 330, v('rake', { look: [0.3, 0] }));

    fillInk(path(q => { q.moveTo(800, 1250); q.lineTo(960, 1250); q.lineTo(1000, 1920); q.lineTo(760, 1920); q.closePath(); }), rgb(CAST.rake.outfitColor), 6);
  },
  dale() {

    x.fillStyle = '#d6ebe2'; x.fillRect(0, 0, W, H);
    fillInk(path(q => q.rect(0, 0, W, 120)), '#f6fbf7', 0); for (let k = 0; k < 3; k++) fillInk(path(q => q.rect(150 + k * 300, 40, 220, 40)), '#ffffff', 4);
    shelves(250, 1300, 8, 0.95);

    halftone(path(q => q.rect(0, 1380, W, 540)), 'rgba(60,80,70,0.25)', 18, 5, [0, 1380, W, H]);
    // the door he's holding open (left), with a blood smiley on the glass
    fillInk(path(q => { q.moveTo(0, 0); q.lineTo(230, 120); q.lineTo(230, 1800); q.lineTo(0, 1920); q.closePath(); }), 'rgba(150,190,200,0.35)', 0);

  },

    halftone(path(q => q.rect(0, 900, W, 1020)), 'rgba(0,0,0,0.4)', 16, 4, [0, 900, W, H]);
    // the store, far away and bright, Dale tiny in the doorway

    fillInk(path(q => q.rect(560, 600, 460, 50)), '#c2262a', 5); x.fillStyle = '#fff'; x.font = '900 34px Inter, sans-serif'; x.textAlign = 'center'; x.fillText('GAS · FOOD', 790, 637);
    fillInk(path(q => q.rect(740, 700, 110, 220)), '#bfe0d2', 4);
    person(795, 770, 26, v('dale'));
    const glow = x.createRadialGradient(790, 800, 40, 790, 800, 520); glow.addColorStop(0, 'rgba(220,255,235,0.4)'); glow.addColorStop(1, 'rgba(220,255,235,0)'); x.fillStyle = glow; x.fillRect(200, 300, 900, 1000);
    // headlights from behind, throwing his shadow forward

    // his arm, the tire iron
    fillInk(path(q => { q.moveTo(-60, 1920); q.lineTo(-40, 1560); q.quadraticCurveTo(120, 1450, 290, 1430); q.lineTo(380, 1640); q.quadraticCurveTo(200, 1700, 160, 1920); q.closePath(); }), '#3b4a36', 7);
    halftone(path(q => { q.moveTo(-60, 1920); q.lineTo(-40, 1560); q.quadraticCurveTo(120, 1450, 290, 1430); q.lineTo(380, 1640); q.quadraticCurveTo(200, 1700, 160, 1920); q.closePath(); }), 'rgba(0,0,0,0.35)', 16, 5, [-60, 1420, 400, H]);
    x.save(); x.translate(390, 1420); x.rotate(-0.72);

  },
  impact() {

    speedLines(420, 760, 'rgba(200,40,20,0.85)', 6);
    starburst(420, 760, 150, 420, 14, '#fff7d6', 3);
    person(640, 860, 300, v('dale', { expr: 'laugh', rot: 0.42 }));

    x.restore();
    for (let k = 0; k < 5; k++) ink(path(q => { q.moveTo(0, 520 + k * 50); q.lineTo(260 - k * 20, 560 + k * 45); }), 8);
  },
  glass() {
    // outside: night, headlights behind the crowd
    sky('#0a0b22', '#241a3a');
    for (const [hx, hy] of [[260, 260], [820, 300]]) { const g = x.createRadialGradient(hx, hy, 10, hx, hy, 520); g.addColorStop(0, 'rgba(255,252,230,0.95)'); g.addColorStop(0.25, 'rgba(255,240,200,0.4)'); g.addColorStop(1, 'rgba(255,240,200,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H); }
    const faces = [[540, 980, 190, 'bald', {}], [250, 640, 165, 'rake', { look: [0.5, 0.3] }], [820, 600, 170, 'trucker', {}], [230, 1260, 150, 'teen', { look: [0.6, -0.2] }], [860, 1250, 160, 'pony', { look: [-0.6, -0.2] }]];
    for (const [fx, fy, fr, k, o] of faces) person(fx, fy, fr, v(k, o));
    // hands pressed flat on the glass
    for (const [hx, hy, hr, hrot, k] of [[90, 900, 120, -0.2, 'rake'], [400, 700, 110, 0.15, 'rake'], [700, 820, 120, -0.1, 'trucker'], [980, 900, 110, 0.25, 'trucker'], [380, 1500, 110, -0.1, 'teen'], [700, 1480, 110, 0.15, 'pony']]) hand(hx, hy, hr, hrot, 'palm', CAST[k].skin);
    // the glass: smudges, a blood smear, reflections
    x.fillStyle = 'rgba(255,255,255,0.08)'; const r = rng(31);
    for (let k = 0; k < 40; k++) { x.beginPath(); x.ellipse(r() * W, r() * H, 30 + r() * 90, 10 + r() * 30, r() * 3, 0, Math.PI * 2); x.fill(); }

    for (let k = 0; k < 4; k++) { x.lineWidth = 9; x.beginPath(); x.moveTo(150 + k * 80, 430 + (k % 2) * 20); x.lineTo(150 + k * 80, 520 + k * 25); x.stroke(); }
    x.fillStyle = 'rgba(255,255,255,0.13)'; x.beginPath(); x.moveTo(600, 0); x.lineTo(700, 0); x.lineTo(200, H); x.lineTo(100, H); x.closePath(); x.fill();
    // the door frame, push bar and the lock he just turned
    fillInk(path(q => q.rect(0, 0, 60, H)), '#33363d', 6); fillInk(path(q => q.rect(W - 60, 0, 60, H)), '#33363d', 6); fillInk(path(q => q.rect(0, 0, W, 60)), '#33363d', 6);
    fillInk(path(q => q.rect(0, 1640, W, 70)), '#43464e', 6);
    fillInk(path(q => q.roundRect(W - 150, 1080, 90, 150, 16)), '#a8acb4', 5); fillInk(path(q => q.rect(W - 120, 1110, 30, 90)), '#3a3c42', 4);
  },

    fillInk(path(q => { q.moveTo(310, 390); q.lineTo(735, 400); q.lineTo(735, 1435); q.lineTo(310, 1445); q.closePath(); }), '#7a4a2a', 6);
    halftone(path(q => { q.moveTo(310, 390); q.lineTo(735, 400); q.lineTo(735, 1435); q.lineTo(310, 1445); q.closePath(); }), 'rgba(30,10,0,0.35)', 16, 5, [300, 380, 740, 1450]);
    fillInk(path(q => q.rect(400, 620, 260, 90)), '#e6e1d0', 5); x.fillStyle = '#b31d1d'; x.font = '900 30px Inter, sans-serif'; x.textAlign = 'center'; x.fillText('EMPLOYEES', 530, 655); x.fillText('ONLY', 530, 692);
    fillInk(path(q => q.arc(690, 950, 22, 0, Math.PI * 2)), '#c9b37a', 4);
    const lg = x.createLinearGradient(800, 0, 1080, 0); lg.addColorStop(0, 'rgba(255,215,130,0.55)'); lg.addColorStop(1, 'rgba(255,215,130,0)'); x.fillStyle = lg; x.beginPath(); x.moveTo(800, 1450); x.lineTo(1080, 1500); x.lineTo(1080, 1920); x.lineTo(780, 1920); x.closePath(); x.fill();
    // the trail
    x.fillStyle = 'rgba(140,8,14,0.9)';
    x.beginPath(); x.moveTo(700, 1440); x.quadraticCurveTo(560, 1600, 420, 1920); x.lineTo(620, 1920); x.quadraticCurveTo(680, 1640, 760, 1445); x.closePath(); x.fill();

    fillInk(path(q => q.rect(150, 1000, 22, 490)), '#a8743c', 5);
  },

    for (let y = 300; y < 1700; y += 260) { fillInk(path(q => q.rect(0, y, W, 18)), '#6b4a34', 4); for (let k = 0; k < 6; k++) fillInk(path(q => q.rect(30 + k * 180, y - 150, 150, 150)), '#a07a52', 4); }
    const bulb = x.createRadialGradient(540, 120, 10, 540, 400, 1100); bulb.addColorStop(0, 'rgba(255,220,150,0.75)'); bulb.addColorStop(1, 'rgba(255,220,150,0)'); x.fillStyle = bulb; x.fillRect(0, 0, W, H);
    ink(path(q => { q.moveTo(540, 0); q.lineTo(540, 90); }), 5); fillInk(path(q => q.arc(540, 120, 34, 0, Math.PI * 2)), '#fff3c4', 5);
