<!doctype html>
<html><head><meta charset="utf-8">
<!-- Tester Short "They Smile - Part 2: The Stare-Down". Noir comic look: black, white, blood red.
     Deterministic: render.js calls render(t) per frame. -->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const T = {
  hookEnd: 2.8, end: 52.0, endCard: 48.0,
  lean: [16.5, 17.3, 21.5],          // leans into the glass, then back
  taps: [28.0, 28.55, 29.1],         // crowbar on the glass
  closeUp: [34.6, 37.2],
  crowd: 37.5, headlights: 40.5,
  stopSmile: 45.0, lookPast: 46.4, cut: 47.8,
  laughs: [[5.9, 4], [10.9, 3], [23.6, 7], [36.2, 6]],   // [time, syllables] Dale's giggles
  // [start, end, text, who]  who: n = narrator, d = Dale
  caps: [
    [3.0, 5.0, 'the cashier was waiting at the door.', 'n'],
    [5.0, 7.3, 'heyyy. you made it.', 'd'],
    [7.5, 9.4, "maddie's phone was in his hand.", 'n'],
    [9.5, 11.9, 'she let me in. sweet kid.', 'd'],
    [12.0, 14.3, "the door wasn't locked.", 'n'],
    [14.4, 16.4, 'he wanted me to open it.', 'n'],
    [16.5, 19.3, "c'mon in. it's only fun if you come in.", 'd'],
    [19.5, 21.9, 'there was a red trail to the back room.', 'n'],
    [22.0, 24.8, "she's back there. still talking about you.", 'd'],
    [25.0, 27.8, 'so we stared at each other. neither of us moved.', 'n'],
    [28.0, 30.3, 'tap. tap. tap.', 'n'],
    [30.5, 32.4, "you know what's funny?", 'd'],
    [32.5, 34.5, "you told her 'i'm 5 min away'", 'd'],
    [34.6, 37.2, '...so did I.', 'd'],
    [37.5, 40.3, 'then i heard them. laughing. a lot of them.', 'n'],
    [40.5, 42.4, 'headlights on route 9.', 'n'],
    [42.5, 44.8, 'those are my friends. they LOVE new people.', 'd'],
    [45.0, 46.3, 'then he stopped smiling.', 'n'],
    [46.4, 47.8, 'he was looking behind me.', 'n'],
  ],
};
window.TIMELINE = T;

const c = document.getElementById('c'), x = c.getContext('2d');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function sn(t, seed) { let v = 0; for (let k = 1; k <= 3; k++) v += Math.sin(t * (0.7 * k + seed) + seed * k * 1.7) / k; return v / 1.83; }

// ---- static world (generated once)
const R0 = rng(42);
const products = [];
for (let side of [-1, 1]) for (let z = 1.2; z < 19; z += 0.55) for (let y of [0.15, 0.62, 1.09, 1.56]) {
  if (R0() < 0.12) continue; // gaps on the shelves
  const hue = [0, 30, 50, 120, 200, 260, 340][R0() * 7 | 0];
  products.push({ side, z, y, h: 0.22 + R0() * 0.18, d: 0.35 + R0() * 0.15, hue, sat: 10 + R0() * 22, lit: 13 + R0() * 13 });
}
const grains = [];
for (let g = 0; g < 8; g++) {
  const gc = document.createElement('canvas'); gc.width = 540; gc.height = 960;
  const gx = gc.getContext('2d'), im = gx.createImageData(540, 960), r = rng(1000 + g);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255 | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gx.putImageData(im, 0, 0); grains.push(gc);
}

// ---- camera / projection
let cam = { vx: 540, vy: 860, f: 900, eye: 1.62 };
const P = (X, Y, Z) => [cam.vx + X * cam.f / Z, cam.vy - (Y - cam.eye) * cam.f / Z];
function quad(a, b, cc, d, fill) { x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.lineTo(...cc); x.lineTo(...d); x.closePath(); x.fillStyle = fill; x.fill(); }
const fog = (z, L) => clamp(L * Math.exp(-z / 9), 0, 1);

function drawAisle(L) {
  const ZN = 0.6, ZF = 20, AW = 1.15, SH = 2.1;
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  // back wall (lit, so the figure reads as a silhouette)
  const bw = fog(ZF, L) * 2.2;
  const a = P(-AW, 0, ZF), b = P(AW, 2.7, ZF);
  x.fillStyle = `rgb(${70 * bw | 0},${80 * bw | 0},${72 * bw | 0})`; x.fillRect(a[0], b[1], b[0] - a[0], a[1] - b[1]);
  // floor
  for (let z = ZN; z < ZF; z += 0.5) {
    const k = fog(z, L) * ((Math.floor(z * 2) % 2) ? 1 : 0.88);
    quad(P(-AW, 0, z), P(AW, 0, z), P(AW, 0, z + 0.5), P(-AW, 0, z + 0.5), `rgb(${46 * k | 0},${50 * k | 0},${46 * k | 0})`);
  }
  // ceiling
  quad(P(-AW, 2.7, ZN), P(AW, 2.7, ZN), P(AW, 2.7, ZF), P(-AW, 2.7, ZF), '#020203');
  // shelving sides + products
  for (const side of [-1, 1]) {
    for (let z = ZN; z < ZF; z += 1) {
      const k = fog(z, L);
      quad(P(side * AW, 0, z), P(side * AW, SH, z), P(side * AW, SH, z + 1), P(side * AW, 0, z + 1), `rgb(${22 * k | 0},${23 * k | 0},${26 * k | 0})`);
    }
  }
  // products drawn far to near
  for (let i = products.length - 1; i >= 0; i--) {
    const p = products[i]; const k = fog(p.z, L); if (k < 0.01) continue;
    const X0 = p.side * AW, X1 = p.side * (AW - p.d);
    // front face of product facing the aisle
    quad(P(X1, p.y, p.z), P(X1, p.y + p.h, p.z), P(X1, p.y + p.h, p.z + 0.42), P(X1, p.y, p.z + 0.42), `hsl(${p.hue},${p.sat}%,${p.lit * k}%)`);
  }
  // shelf lips
  for (const side of [-1, 1]) for (const y of [0.13, 0.6, 1.07, 1.54, 2.05]) {
    x.strokeStyle = `rgba(120,125,120,${0.5 * L})`; x.lineWidth = 3;
    x.beginPath(); x.moveTo(...P(side * (AW - 0.5), y, ZN + 0.2)); x.lineTo(...P(side * (AW - 0.5), y, ZF)); x.stroke();
  }
  // fluorescent panels
  for (let z = 5; z < ZF; z += 3) {
    const on = L > 0.05;
    quad(P(-0.25, 2.69, z), P(0.25, 2.69, z), P(0.25, 2.69, z + 1.2), P(-0.25, 2.69, z + 1.2), on ? `rgba(225,240,228,${clamp(L * 1.1, 0, 1)})` : '#0a0a0a');
  }
}



// ---------- Dale: an ordinary middle-aged cashier. The rash ("the bloom") spreads from his mouth.
const RB = rng(777);
const bloom = [];            // rash blotches in face space (-1..1)
for (let i = 0; i < 180; i++) {
  const a = RB() * Math.PI * 2, d = Math.pow(RB(), 0.7);
  const bx = Math.cos(a) * d * 0.62, by = 0.42 + Math.sin(a) * d * 0.5 - d * 0.25;
  bloom.push({ x: bx, y: by, r: 0.015 + RB() * 0.045 * (1 - d * 0.6), a: 0.35 + RB() * 0.5 });
}
const veins = [];
for (let i = 0; i < 0; i++) { const sx = i % 2 ? 1 : -1; veins.push({ sx, a: -0.3 - RB() * 1.2, l: 0.25 + RB() * 0.35, k: RB() }); }
const splat = [];
for (let i = 0; i < 26; i++) splat.push({ x: -0.6 + RB() * 0.9, y: -0.7 + RB() * 1.5, r: 0.008 + RB() * 0.03 });
const stub = [];
for (let i = 0; i < 260; i++) { const a = Math.PI * (0.1 + RB() * 0.8), d = 0.55 + RB() * 0.4; stub.push({ x: Math.cos(a) * d * 0.72, y: 0.15 + Math.sin(a) * d * 0.85 }); }

// face. r = half the head height in px. talk 0..1 = jaw open. smile 0..1. look = eye direction. Painted soft, lit from below by the phone.
function blob(cx, cy, rx, ry, col, a0) {
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, col.replace('A', a0)); g.addColorStop(1, col.replace('A', 0));
  x.save(); x.translate(cx, cy); x.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry)); x.translate(-cx, -cy);
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, Math.max(rx, ry), 0, Math.PI * 2); x.fill(); x.restore();
}
function drawFace(cx, cy, r, o) {
  const { talk = 0, smile = 1, look = [0, 0], light = 1, tilt = 0 } = o;
  const lv = clamp(light, 0.3, 1.3);
  x.save(); x.translate(cx, cy); x.rotate(tilt);
  const line = Math.max(1, r * 0.012);
  const SK = (k, a = 1) => `rgba(${(214 * k) | 0},${(168 * k) | 0},${(146 * k) | 0},${a})`; // skin at brightness k
  // ears
  for (const sx of [-1, 1]) { x.fillStyle = SK(0.35 * lv); x.beginPath(); x.ellipse(sx * r * 0.76, r * 0.02, r * 0.1, r * 0.19, sx * 0.1, 0, Math.PI * 2); x.fill(); }
  // head: heavy jaw, a bit of jowl
  const head = new Path2D();
  head.moveTo(-r * 0.7, -r * 0.4);
  head.quadraticCurveTo(-r * 0.7, -r * 1.0, 0, -r * 1.0);
  head.quadraticCurveTo(r * 0.7, -r * 1.0, r * 0.7, -r * 0.4);
  head.bezierCurveTo(r * 0.74, r * 0.2, r * 0.66, r * 0.6, r * 0.4, r * 0.84);
  head.quadraticCurveTo(0, r * (1.02 + 0.07 * talk), -r * 0.4, r * 0.84);
  head.bezierCurveTo(-r * 0.66, r * 0.6, -r * 0.74, r * 0.2, -r * 0.7, -r * 0.4);
  x.save(); x.clip(head);
  // base: lit from below, the top of the head falls off into darkness
  const g = x.createLinearGradient(0, r * 1.0, 0, -r * 1.0);
  g.addColorStop(0, SK(0.95 * lv)); g.addColorStop(0.35, SK(0.72 * lv)); g.addColorStop(0.7, SK(0.38 * lv)); g.addColorStop(1, SK(0.1));
  x.fillStyle = g; x.fillRect(-r, -r * 1.1, r * 2, r * 2.2);
  // form: soft side falloff, lit chin, cheeks, nose underside
  blob(r * 0.62, 0, r * 0.4, r * 1.0, 'rgba(10,5,4,A)', 0.7 * 1);
  blob(-r * 0.66, 0, r * 0.25, r * 1.0, 'rgba(10,5,4,A)', 0.45);
  blob(0, r * 0.88, r * 0.3, r * 0.14, `rgba(255,225,205,A)`, 0.35 * lv);
  for (const sx of [-1, 1]) blob(sx * r * 0.36, r * 0.22, r * 0.2, r * 0.14, 'rgba(255,215,195,A)', 0.22 * lv);
  // the bloom: a red rash spreading from the mouth, finer and blotchier
  for (const b of bloom) blob(b.x * r, b.y * r + r * 0.05, b.r * r * 1.5, b.r * r * 1.2, 'rgba(170,18,22,A)', b.a * 0.75);
  x.strokeStyle = 'rgba(120,10,14,0.55)'; x.lineWidth = Math.max(1, r * 0.006);
  for (const v of veins) {
    x.beginPath(); x.moveTo(v.sx * r * 0.28, r * 0.45);
    x.quadraticCurveTo(v.sx * r * (0.35 + v.k * 0.2), r * (0.32 - v.k * 0.1), v.sx * r * (0.28 + Math.cos(v.a) * v.l), r * (0.45 + Math.sin(v.a) * v.l)); x.stroke();
  }
  // stubble
  x.fillStyle = 'rgba(40,26,22,0.35)';
  for (const st of stub) x.fillRect(st.x * r, st.y * r, Math.max(1, r * 0.007), Math.max(1, r * 0.007));
  // blood spatter (small)
  x.fillStyle = 'rgba(100,0,4,0.9)';
  for (const sp of splat) { x.beginPath(); x.arc(sp.x * r, sp.y * r, sp.r * r * 0.6, 0, Math.PI * 2); x.fill(); }
  // eye sockets (shadowed from above), bags under the eyes, forehead lines
  for (const sx of [-1, 1]) {
    blob(sx * r * 0.3, -r * 0.2, r * 0.22, r * 0.14, 'rgba(25,12,10,A)', 0.75);
    x.strokeStyle = 'rgba(60,30,25,0.6)'; x.lineWidth = line;
    x.beginPath(); x.moveTo(sx * r * 0.18, -r * 0.03); x.quadraticCurveTo(sx * r * 0.3, r * 0.04, sx * r * 0.43, -r * 0.04); x.stroke();
  }
  x.strokeStyle = 'rgba(30,15,12,0.35)'; x.lineWidth = line;
  for (let k = 0; k < 3; k++) { x.beginPath(); x.moveTo(-r * 0.35, -r * (0.56 + k * 0.07)); x.quadraticCurveTo(0, -r * (0.6 + k * 0.07 + 0.03 * smile), r * 0.35, -r * (0.56 + k * 0.07)); x.stroke(); }
  // hair: short, thinning, dark
  x.fillStyle = '#0b0807';
  x.beginPath(); x.moveTo(-r * 0.72, -r * 0.35); x.quadraticCurveTo(-r * 0.78, -r * 1.1, 0, -r * 1.06); x.quadraticCurveTo(r * 0.78, -r * 1.1, r * 0.72, -r * 0.35);
  x.lineTo(r * 0.62, -r * 0.5); x.quadraticCurveTo(r * 0.35, -r * 0.86, 0, -r * 0.8); x.quadraticCurveTo(-r * 0.35, -r * 0.86, -r * 0.62, -r * 0.5); x.closePath(); x.fill();
  x.restore();
  // brows: thick, raised in delight (they drop when he stops smiling)
  const br = 0.1 * smile;
  x.strokeStyle = '#120a08'; x.lineCap = 'round'; x.lineWidth = r * 0.045;
  for (const sx of [-1, 1]) { x.beginPath(); x.moveTo(sx * r * 0.13, -r * (0.33 + br * 0.4)); x.quadraticCurveTo(sx * r * 0.3, -r * (0.42 + br), sx * r * 0.48, -r * (0.35 + br * 0.3)); x.stroke(); }
  // eyes: wide awake and delighted, slightly bloodshot
  for (const sx of [-1, 1]) {
    const ex = sx * r * 0.3, ey = -r * 0.17, ew = r * 0.11, eh = r * lerp(0.05, 0.065, 1 - smile);
    const eye = new Path2D(); eye.moveTo(ex - ew, ey); eye.quadraticCurveTo(ex, ey - eh * 2, ex + ew, ey); eye.quadraticCurveTo(ex, ey + eh * (1.3 - smile * 0.5), ex - ew, ey);
    x.fillStyle = `rgba(${200 * lv | 0},${185 * lv | 0},${172 * lv | 0},1)`; x.fill(eye);
    x.save(); x.clip(eye);
    blob(ex - sx * ew, ey, ew * 0.6, eh, 'rgba(180,30,30,A)', 0.5);
    const ix = ex + look[0] * ew * 0.45, iy = ey + look[1] * eh * 0.5;
    x.fillStyle = '#3a2a1c'; x.beginPath(); x.arc(ix, iy, eh * 0.95, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#050302'; x.beginPath(); x.arc(ix, iy, eh * 0.42, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.95)'; x.beginPath(); x.arc(ix - eh * 0.25, iy + eh * 0.3, eh * 0.16, 0, Math.PI * 2); x.fill();
    blob(ex, ey - eh * 1.2, ew * 1.2, eh * 1.2, 'rgba(0,0,0,A)', 0.55); // upper lid shadow
    x.restore();
    x.strokeStyle = 'rgba(20,10,8,0.9)'; x.lineWidth = line * 1.6; x.beginPath(); x.moveTo(ex - ew, ey); x.quadraticCurveTo(ex, ey - eh * 2, ex + ew, ey); x.stroke();
    x.strokeStyle = 'rgba(60,30,25,0.5)'; x.lineWidth = line;
    for (let k = 0; k < Math.round(3 * smile); k++) { x.beginPath(); x.moveTo(sx * r * 0.43, ey + k * r * 0.03); x.lineTo(sx * r * 0.52, ey - r * 0.03 + k * r * 0.05); x.stroke(); }
  }
  // nose: soft shading, lit underside, nostrils
  blob(r * 0.08, r * 0.05, r * 0.07, r * 0.2, 'rgba(20,10,8,A)', 0.5);
  blob(0, r * 0.22, r * 0.12, r * 0.06, 'rgba(255,220,200,A)', 0.45 * lv);
  x.fillStyle = 'rgba(25,10,8,0.95)';
  for (const sx of [-1, 1]) { x.beginPath(); x.ellipse(sx * r * 0.065, r * 0.245, r * 0.035, r * 0.02, sx * 0.3, 0, Math.PI * 2); x.fill(); }
  x.strokeStyle = 'rgba(40,18,14,0.7)'; x.lineWidth = line;
  for (const sx of [-1, 1]) { x.beginPath(); x.moveTo(sx * r * 0.06, r * 0.15); x.quadraticCurveTo(sx * r * 0.15, r * 0.2, sx * r * 0.1, r * 0.27); x.stroke(); }
  // mouth: a normal man's grin, just a little too wide, and it never stops
  const mw = r * lerp(0.17, 0.33, smile), up = r * 0.09 * smile, my = r * 0.5, open = r * (0.03 + 0.14 * talk + 0.05 * smile);
  const mouth = new Path2D();
  mouth.moveTo(-mw, my - up); mouth.quadraticCurveTo(0, my + up * 0.1 - r * 0.02, mw, my - up);
  mouth.quadraticCurveTo(0, my + open + up, -mw, my - up);
  x.fillStyle = '#1a0506'; x.fill(mouth);
  x.save(); x.clip(mouth);
  if (smile > 0.3) {
    x.fillStyle = `rgba(${226 * lv | 0},${214 * lv | 0},${190 * lv | 0},1)`; x.fillRect(-mw, my - up - r * 0.05, mw * 2, r * 0.05 + up * 0.75);
    x.fillStyle = 'rgba(130,10,10,0.75)'; x.fillRect(-mw * 0.5, my - up * 0.25, mw * 0.8, r * 0.018);
    x.strokeStyle = 'rgba(60,40,30,0.45)'; x.lineWidth = line * 0.6;
    for (let i = -4; i <= 4; i++) { x.beginPath(); x.moveTo(i * mw * 0.21, my - up - r * 0.05); x.lineTo(i * mw * 0.21, my - up + r * 0.025); x.stroke(); }
  }
  blob(0, my + open + up, mw * 0.8, r * 0.05, 'rgba(0,0,0,A)', 0.5);
  x.restore();
  // lips
  x.strokeStyle = `rgba(${120 * lv | 0},${55 * lv | 0},${50 * lv | 0},0.9)`; x.lineWidth = line * 1.4;
  x.beginPath(); x.moveTo(-mw, my - up); x.quadraticCurveTo(0, my + up * 0.1 - r * 0.02, mw, my - up); x.stroke();
  blob(0, my + open + up + r * 0.04, mw * 0.6, r * 0.03, `rgba(${150 * lv | 0},70,62,A)`, 0.6);
  // smile lines cutting into the cheeks
  x.strokeStyle = 'rgba(40,16,12,0.7)'; x.lineWidth = line * 1.5;
  for (const sx of [-1, 1]) { x.beginPath(); x.moveTo(sx * r * 0.17, r * 0.24); x.quadraticCurveTo(sx * (mw + r * 0.1), r * 0.38, sx * (mw + r * 0.03), my + r * 0.06 * smile); x.stroke(); }
  x.restore();
}

function drawDale(Z, o) {
  const s = cam.f / Z;
  const [fx, fy] = P(0, 0, Z);
  const X = m => fx + m * s, Y = m => fy - m * s;
  const shake = o.giggle * Math.sin(o.t * 55) * 0.006;
  const sy = shake;
  // torso: dark shirt, dull red work vest, name tag
  x.fillStyle = '#141313';
  x.beginPath(); x.moveTo(X(-0.3), Y(0.6)); x.lineTo(X(-0.31), Y(1.4 + sy)); x.quadraticCurveTo(X(-0.29), Y(1.52 + sy), X(-0.1), Y(1.56 + sy));
  x.lineTo(X(0.1), Y(1.56 + sy)); x.quadraticCurveTo(X(0.29), Y(1.52 + sy), X(0.31), Y(1.4 + sy)); x.lineTo(X(0.3), Y(0.6)); x.closePath(); x.fill();
  // vest panels lit by the phone
  const vg = x.createLinearGradient(0, Y(0.7), 0, Y(1.55));
  vg.addColorStop(0, 'rgba(8,2,2,1)'); vg.addColorStop(0.55, `rgba(96,22,20,${0.9 * o.light})`); vg.addColorStop(1, 'rgba(30,7,6,1)');
  x.fillStyle = vg;
  for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(X(sd * 0.07), Y(1.52 + sy)); x.lineTo(X(sd * 0.27), Y(1.45 + sy)); x.lineTo(X(sd * 0.28), Y(0.62)); x.lineTo(X(sd * 0.09), Y(0.62)); x.closePath(); x.fill(); }
  // name tag
  x.fillStyle = `rgba(235,230,220,${0.4 + 0.6 * o.light})`; x.fillRect(X(-0.24), Y(1.34 + sy), 0.13 * s, 0.05 * s);
  x.fillStyle = '#000'; x.font = `800 ${0.028 * s | 0}px Inter, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('DALE', X(-0.175), Y(1.315 + sy));
  // left arm down, holding a crowbar (or raised to tap it on the glass)
  const tapUp = o.tap;
  x.strokeStyle = '#000'; x.lineCap = 'round'; x.lineWidth = 0.1 * s;
  const hx = lerp(-0.36, -0.26, tapUp), hy = lerp(0.82, 1.35, tapUp);
  x.beginPath(); x.moveTo(X(-0.29), Y(1.45 + sy)); x.quadraticCurveTo(X(-0.4), Y(1.1), X(hx), Y(hy)); x.stroke();
  x.strokeStyle = '#111'; x.lineWidth = 0.03 * s;
  const cx2 = lerp(-0.4, -0.1, tapUp), cy2 = lerp(0.2, 1.55 + o.tapHit * 0.03, tapUp);
  x.beginPath(); x.moveTo(X(hx), Y(hy + 0.15 * (1 - tapUp))); x.lineTo(X(cx2), Y(cy2)); x.stroke();
  x.strokeStyle = 'rgba(120,0,4,1)'; x.lineWidth = 0.034 * s; x.beginPath(); x.moveTo(X(lerp(hx, cx2, 0.75)), Y(lerp(hy, cy2, 0.75))); x.lineTo(X(cx2), Y(cy2)); x.stroke();
  // right arm up, holding Maddie's phone at chest height: the light source
  x.strokeStyle = '#000'; x.lineWidth = 0.1 * s;
  x.beginPath(); x.moveTo(X(0.29), Y(1.45 + sy)); x.quadraticCurveTo(X(0.36), Y(1.0), X(0.12), Y(1.12)); x.stroke();
  x.fillStyle = '#000'; x.beginPath(); x.ellipse(X(0.12), Y(1.12), 0.05 * s, 0.045 * s, 0, 0, Math.PI * 2); x.fill();
  if (o.phone) {
    x.save(); x.translate(X(0.1), Y(1.2)); x.rotate(-0.25);
    x.fillStyle = '#111'; x.fillRect(-0.04 * s, -0.08 * s, 0.08 * s, 0.16 * s);
    x.fillStyle = 'rgba(215,230,255,0.95)'; x.fillRect(-0.034 * s, -0.072 * s, 0.068 * s, 0.144 * s);
    x.fillStyle = 'rgba(47,95,208,0.9)'; for (let k = 0; k < 4; k++) x.fillRect(-0.025 * s + (k % 2) * 0.02 * s, -0.05 * s + k * 0.03 * s, 0.03 * s, 0.015 * s);
    x.restore();
    // glow
    const pg = x.createRadialGradient(X(0.1), Y(1.2), 0, X(0.1), Y(1.2), 0.5 * s);
    pg.addColorStop(0, 'rgba(200,220,255,0.25)'); pg.addColorStop(1, 'rgba(200,220,255,0)');
    x.fillStyle = pg; x.fillRect(X(-0.6), Y(1.8), 1.2 * s, 1.2 * s);
  }
  // neck + head
  const ng = x.createLinearGradient(0, Y(1.56), 0, Y(1.7)); ng.addColorStop(0, `rgba(150,110,95,${0.9 * o.light})`); ng.addColorStop(1, 'rgba(30,20,16,1)');
  x.fillStyle = ng; x.fillRect(X(-0.055), Y(1.7 + sy), 0.11 * s, 0.16 * s);
  x.fillStyle = '#1e1c1c'; for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(X(sd * 0.04), Y(1.56 + sy)); x.lineTo(X(sd * 0.11), Y(1.58 + sy)); x.lineTo(X(sd * 0.06), Y(1.5 + sy)); x.closePath(); x.fill(); }
  drawFace(X(o.tilt * 0.1), Y(1.77 + sy), 0.125 * s, o);
}

// ---------- the glass door between them
const RG = rng(99);
const smears = [[180, 520, 95], [900, 430, 80], [820, 1060, 110], [240, 1180, 70], [560, 300, 60]];
function drawGlass(t, headlight) {
  // door frame
  x.fillStyle = '#0b0b0c'; x.fillRect(0, 0, 70, H); x.fillRect(W - 70, 0, 70, H); x.fillRect(0, 0, W, 90);
  x.fillStyle = '#18181a'; x.fillRect(0, 1180, W, 46); // push bar
  x.fillStyle = 'rgba(255,255,255,0.12)'; x.fillRect(0, 1180, W, 5);
  x.fillStyle = 'rgba(230,230,230,0.5)'; x.font = '800 30px Inter, sans-serif'; x.textAlign = 'center'; x.fillText('PUSH', 540, 1150);
  // blood smileys from Part 1, with drips
  x.lineCap = 'round'; x.strokeStyle = 'rgba(125,4,8,0.7)'; x.fillStyle = 'rgba(125,4,8,0.7)';
  for (const [sx, sy, sr] of smears) {
    x.lineWidth = sr * 0.14;
    x.beginPath(); x.arc(sx, sy, sr, 0, Math.PI * 2); x.stroke();
    x.beginPath(); x.arc(sx - sr * 0.35, sy - sr * 0.25, sr * 0.1, 0, Math.PI * 2); x.arc(sx + sr * 0.35, sy - sr * 0.25, sr * 0.1, 0, Math.PI * 2); x.fill();
    x.beginPath(); x.arc(sx, sy + sr * 0.05, sr * 0.55, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke();
    x.lineWidth = sr * 0.06;
    for (let k = 0; k < 3; k++) { const dx = sx + (k - 1) * sr * 0.45, len = sr * (0.4 + 0.5 * ((k * 7 + sx) % 5) / 5); x.beginPath(); x.moveTo(dx, sy + sr * 0.9); x.lineTo(dx, sy + sr * 0.9 + len); x.stroke(); }
  }
  // greasy glass reflections, brighter in the headlights
  x.save(); x.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 4; k++) {
    const gx = 120 + k * 260;
    const lg = x.createLinearGradient(gx, 0, gx + 160, 400);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, `rgba(255,255,255,${0.035 + 0.12 * headlight})`); lg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = lg; x.beginPath(); x.moveTo(gx, 90); x.lineTo(gx + 70, 90); x.lineTo(gx - 330, H); x.lineTo(gx - 400, H); x.closePath(); x.fill();
  }
  // neon OPEN sign in the corner, flickering
  const on = !(Math.sin(t * 13) > 0.93 || Math.sin(t * 3.1) > 0.985);
  x.font = '900 64px "Inter Display", Inter, sans-serif'; x.textAlign = 'left';
  x.shadowColor = 'rgba(255,40,40,0.9)'; x.shadowBlur = on ? 30 : 0;
  x.fillStyle = on ? 'rgba(255,70,70,0.95)' : 'rgba(80,10,10,0.6)'; x.fillText('OPEN', 110, 190);
  x.font = '700 26px Inter, sans-serif'; x.fillText('24 HOURS', 116, 230);
  x.restore();
}

function caption(txt, alpha, who) {
  x.save(); x.globalAlpha = alpha; x.textAlign = 'center'; x.textBaseline = 'middle';
  const dale = who === 'd';
  x.font = dale ? 'italic 900 70px "Inter Display", Inter, sans-serif' : '800 62px Inter, "DejaVu Sans", sans-serif';
  const words = (dale ? '“' + txt + '”' : txt).split(' '), lines = []; let cur = '';
  for (const w of words) { const tr = cur ? cur + ' ' + w : w; if (x.measureText(tr).width > 900) { lines.push(cur); cur = w; } else cur = tr; }
  lines.push(cur);
  lines.forEach((ln, i) => {
    const y = 1420 + (i - (lines.length - 1) / 2) * 80;
    x.lineWidth = 16; x.strokeStyle = 'rgba(0,0,0,0.95)'; x.lineJoin = 'round'; x.strokeText(ln, 540, y);
    x.fillStyle = dale ? '#ff2a2a' : '#fff'; x.fillText(ln, 540, y);
  });
  if (dale) { x.font = '800 30px Inter, sans-serif'; x.fillStyle = '#ff2a2a'; x.lineWidth = 8; const y0 = 1420 - (lines.length - 1) * 40 - 70; x.strokeText('DALE', 540, y0); x.fillText('DALE', 540, y0); }
  x.restore();
}

function bigText(lines, y0, size, colors, alpha) {
  x.save(); x.globalAlpha = alpha; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `900 ${size}px "Inter Display", Inter, sans-serif`;
  lines.forEach((ln, i) => {
    const y = y0 + i * size * 1.02;
    x.lineWidth = 18; x.strokeStyle = 'rgba(0,0,0,0.9)'; x.lineJoin = 'round'; x.strokeText(ln, 540, y);
    x.fillStyle = colors[i]; x.fillText(ln, 540, y);
  });
  x.restore();
}

function inCap(t, who) { return T.caps.some(([a, b, , w]) => w === who && t >= a && t < b); }

window.render = function (t) {
  const post = [];  // drawn after the colour grade so text stays crisp
  const frame = Math.round(t * 30), r = rng(frame * 7919 + 13);
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.shadowBlur = 0;
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);

  const talking = inCap(t, 'd');
  const talk = talking ? Math.abs(Math.sin(t * 11)) * 0.8 + Math.abs(Math.sin(t * 4.3)) * 0.2 : 0;
  let giggle = 0;
  for (const [lt, n] of T.laughs) { const d = t - lt; if (d >= 0 && d < n * 0.17 + 0.2) giggle = 1; }
  const smile = 1 - ease((t - T.stopSmile) / 0.4);
  const look = t >= T.lookPast ? [0.55, -0.7] : [sn(t * 0.3, 5) * 0.1, 0];
  let tap = 0, tapHit = 0;
  const tapA = T.taps[0] - 0.4, tapB = T.taps[T.taps.length - 1] + 0.4;
  if (t >= tapA && t < tapB) { tap = ease((t - tapA) / 0.3) * ease((tapB - t) / 0.3); for (const k of T.taps) if (t >= k && t < k + 0.1) tapHit = 1; }
  // lean into the glass
  let Z = 1.12;
  const [la, lb, lc] = T.lean;
  if (t >= la) Z = lerp(1.12, 0.78, ease((t - la) / (lb - la)));
  if (t >= lc) Z = lerp(0.78, 1.12, ease((t - lc) / 0.8));
  const headlight = t >= T.headlights ? clamp((t - T.headlights) / 2.5, 0, 1) * (0.75 + 0.25 * Math.sin(t * 2)) : 0;
  const tilt = 0.08 * Math.sin(t * 0.5) + (talking ? 0.04 * Math.sin(t * 3) : 0) + giggle * 0.05 * Math.sin(t * 40);
  const o = { t, talk: giggle ? 0.7 + 0.3 * Math.sin(t * 50) : talk, smile, look, light: 1 + 0.3 * headlight, tilt, giggle, tap, tapHit, phone: true };

  // handheld camera, slow push while they stare
  const shakeAmt = 5 + 9 * clamp((t - 25) / 22, 0, 1) + (tapHit ? 10 : 0);
  cam.vx = 540 + sn(t * 1.3, 1) * shakeAmt; cam.vy = 860 + sn(t * 1.1, 2) * shakeAmt * 0.8;
  cam.f = 900 * (1 + 0.12 * ease((t - 25) / 20));

  const isHook = t < T.hookEnd, isClose = t >= T.closeUp[0] && t < T.closeUp[1], isEnd = t >= T.endCard, isBlack = t >= T.cut && !isEnd;

  if (isHook || isClose) {
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    const k = isHook ? 1 + 0.05 * t : 1 + 0.08 * (t - T.closeUp[0]);
    drawFace(540 + sn(t * 2, 3) * 8, 900 + sn(t * 2, 4) * 8, 520 * k, { ...o, light: 1.1, tilt: 0.06 });
    drawGlass(t, 0);
    if (isHook) {
      post.push(() => { bigText(["THEY DON'T", 'KILL YOU.'], 230, 120, ['#fff', '#fff'], t > 0.15 ? 1 : 0);
      bigText(['NOT AT FIRST.'], 1560, 120, ['#ff2a2a'], t > 1.2 ? 1 : 0); });
    } else {
      for (const [a, b, txt, who] of T.caps) if (t >= a && t < b) post.push(() => caption(txt, clamp((t - a) / 0.12, 0, 1), who));
    }
  } else if (isEnd) {
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    bigText(['PART 3?'], 760, 150, ['#ff2a2a'], t >= T.endCard + 0.4 ? 1 : 0);
    x.save(); x.textAlign = 'center'; x.fillStyle = '#eee'; x.font = '700 58px Inter, sans-serif';
    x.globalAlpha = t >= T.endCard + 1.2 ? 1 : 0; x.fillText('Go in for Maddie,', 540, 960); x.fillText('or run?', 540, 1035);
    x.globalAlpha = t >= T.endCard + 2.2 ? 1 : 0; x.fillStyle = '#9a9aa2'; x.font = '600 44px Inter, sans-serif';
    x.fillText('Comment IN or RUN', 540, 1180); x.restore();
  } else if (!isBlack) {
    // store interior behind the glass
    const L = 0.8 + (r() < 0.03 ? -0.5 : 0);
    drawAisle(L);
    // blood trail on the floor to the back room
    x.fillStyle = 'rgba(110,0,4,0.85)';
    for (let z = 1.6; z < 16; z += 0.35) { const px = Math.sin(z * 0.7) * 0.25 + (z > 11 ? (z - 11) * 0.2 : 0); const a = P(px - 0.09, 0, z), b = P(px + 0.09, 0, z + 0.3); x.beginPath(); x.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.abs(b[0] - a[0]) / 2 + 2, Math.abs(a[1] - b[1]) / 2 + 1, 0, 0, Math.PI * 2); x.fill(); }
    // the exterior is dark: darken the interior a touch, so the door reads as glass
    x.fillStyle = 'rgba(0,0,0,0.25)'; x.fillRect(0, 0, W, H);
    drawDale(Z, o);
    drawGlass(t, headlight);
    // headlights sweeping across the glass
    if (headlight > 0) {
      x.save(); x.globalCompositeOperation = 'lighter';
      const hx = lerp(1400, 300, clamp((t - T.headlights) / 7, 0, 1));
      for (const off of [-140, 140]) { const hg = x.createRadialGradient(hx + off, 1000, 0, hx + off, 1000, 520); hg.addColorStop(0, `rgba(255,250,235,${0.33 * headlight})`); hg.addColorStop(1, 'rgba(255,250,235,0)'); x.fillStyle = hg; x.fillRect(0, 0, W, H); }
      x.restore();
    }
    x.save(); x.strokeStyle = '#d01b1b'; x.lineWidth = 4; x.fillStyle = '#d01b1b'; x.font = '800 32px Inter, sans-serif';
    x.strokeRect(830, 120, 190, 58); x.textBaseline = 'middle'; x.textAlign = 'center'; x.fillText('PART 2', 925, 150); x.restore();
    for (const [a, b, txt, who] of T.caps) if (t >= a && t < b) post.push(() => caption(txt, clamp((t - a) / 0.12, 0, 1) * clamp((b - t) / 0.12, 0, 1), who));
  }

  // grade: crushed noir blacks, blood-red tint creeping in
  if (!isEnd && !isBlack) {
    const dread = clamp((t - 3) / 42, 0, 1);
    x.globalCompositeOperation = 'multiply'; x.fillStyle = `rgba(215,${190 - 60 * dread | 0},${185 - 60 * dread | 0},1)`; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'source-over';
    if (tapHit) { x.fillStyle = 'rgba(255,255,255,0.06)'; x.fillRect(0, 0, W, H); }
  }
  const v = x.createRadialGradient(540, 960, 420, 540, 960, 1150);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.85)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
  for (const f of post) f();
  x.globalAlpha = 0.13; x.globalCompositeOperation = 'screen'; x.drawImage(grains[frame % 8], 0, 0, W, H);
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
};
render(0);
</script>
</body></html>
